<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monzurul's GitOps Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #183153;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      background: white;
      padding: 48px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px #00000015;
    }
    h1 { color: #1565c0; }
    .version {
      background: #e3f2fd;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Monzurul's GitOps Lab</h1>
    <p>Running on my two-laptop Kubernetes cluster.</p>
    <p>Built by GitHub Actions. Deployed by Argo CD.</p>
    <p class="version">Application Version 1</p>
  </main>
</body>
</html>
