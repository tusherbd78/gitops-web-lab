name: Build and deploy application

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - Dockerfile
      - .dockerignore
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: gitops-web-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tusherbd78/gitops-web-lab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update deployment image in Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i \
            "s|image: ghcr.io/tusherbd78/gitops-web-lab:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|" \
            apps/web/deployment.yaml

          git add apps/web/deployment.yaml

          if git diff --cached --quiet; then
            echo "Deployment already references this image."
            exit 0
          fi

          git commit -m "Deploy image ${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
